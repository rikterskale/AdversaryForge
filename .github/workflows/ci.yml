name: AdversaryForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adversaryforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, coverage, and static verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove installation prerequisites
        run: |
          node --version
          npm --version
          python3 --version

      - name: Run 100% coverage test gate
        run: npm test

      - name: Run static product-contract verification
        run: npm run verify

      - name: Validate documented local startup
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/adversaryforge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..10}; do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/index.html | grep -q "AdversaryForge"

      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-evidence
          path: |
            INSTALLATION.md
            docs/troubleshooting.md
            docs/release-readiness.md
            README.md

  release-readiness:
    name: New-user release-readiness contract
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release standard is present
        run: |
          test -f INSTALLATION.md
          test -f docs/release-readiness.md
          grep -qi "proven installation" docs/release-readiness.md
          grep -qi "guided troubleshooting" docs/release-readiness.md
          grep -qi "full-feature validation" docs/release-readiness.md
          grep -qi "tested recovery paths" docs/release-readiness.md
          grep -qi "documentation" docs/release-readiness.md

      - name: Report release decision
        run: echo "New-user release-readiness standard is present; human approval remains required for promotion."
